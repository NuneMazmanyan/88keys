[project]
name = "pianoscribe"
version = "0.1.0"
description = "88keys: piano audio to sheet music, with automatic harmonization and arrangement"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "soundfile>=0.12",
    "soxr>=0.3",
    "librosa>=0.10",
    "pretty_midi>=0.2.10",
    "mir_eval>=0.7",
    "music21>=9.1",
    "pyyaml>=6",
    "tqdm>=4.66",
    "remotezip>=0.12",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "lightning>=2.3",
    "hydra-core>=1.3",
    "wandb>=0.17",
    "torch-audiomentations>=0.11",
]
symbolic = [
    "datasets>=2.19",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pianoscribe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
